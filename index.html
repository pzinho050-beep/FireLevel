<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireLevel - Contato</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<nav class="menu">
<a class="marca" href="#contato">
<span>F</span>
FireLevel
</a>
<button id="botaoMenu" aria-label="Abrir menu">Menu</button>
<ul id="listaMenu">
<li><a href="#contato">Contato</a></li>
</ul>
</nav>
</header>
<main>
<section class="contato" id="contato">
<div>
<p class="subtitulo">Entrar em contato</p>
<h1>Fale com a FireLevel</h1>
<p>
Preencha o formulario para pedir informacoes, tirar duvidas ou falar com a
equipe do projeto.
</p>
<div class="info-contato">
<p><strong>Atendimento:</strong> segunda a sexta, das 8h as 18h</p>
<p><strong>Projeto:</strong> TCC ETEC - 2 modulo</p>
</div>
</div>

<form action="https://formspree.io/f/mpqnldov" method="POST" id="formContato">
<input type="hidden" name="_subject" value="Novo contato FireLevel">
<label for="nome">Nome e sobrenome</label>
<input type="text" id="nome" name="nome" required>
<label for="email">E-mail</label>
<input type="email" id="email" name="email" required>
<label for="tipoPedido">Tipo de interesse</label>
<select id="tipoPedido" name="tipo_interesse" required>
<option value="">Selecione uma opcao</option>
<option>Informacoes sobre a FireLevel</option>
<option>Suporte</option>
<option>Parceria ou evento</option>
<option>Outro assunto</option>
</select>

<label for="Mensagem">Mensagem</label>
<textarea id="Mensagem" name="Mensagem" rows="5" placeholder="Conte exatamente o que voce precisa."></textarea>
<button class="botao" type="submit">Enviar</button>
<p id="aviso"></p>
</form>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
